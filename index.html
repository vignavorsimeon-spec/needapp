<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APPNEED</title>
<style>
  body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#0b1f4d}
  header{background:#0b1f4d;color:#fff;padding:24px 16px;text-align:center}
  header h1{margin:0;font-size:28px}
  header h1 span{color:#ff9800}
  header p{margin:8px 0 0}
  .search{padding:16px}
  .search input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #ccd;border-radius:12px;font-size:16px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 24px}
  .cat{border-radius:14px;padding:22px 8px;text-align:center;color:#fff;font-weight:bold;font-size:16px}
  .c1{background:#1e63d6}.c2{background:#ff9800}.c3{background:#2fa84f}
  .c4{background:#7b3fe4}.c5{background:#0e8fa8}.c6{background:#e53935}
</style>
</head>
<body>
<header>
  <h1>APP<span>NEED</span></h1>
  <p>Tout ce dont vous avez besoin, au même endroit !</p>
</header>
<div class="search"><input type="text" placeholder="Rechercher un bien, un service..."></div>
<div class="grid">
  <div class="cat c1">🏠 Immobilier</div>
  <div class="cat c2">🚗 Véhicules</div>
  <div class="cat c3">🛍️ Produits</div>
  <div class="cat c4">🌴 Loisirs</div>
  <div class="cat c5">🔧 Services</div>
  <div class="cat c6">💼 Emplois</div>
</div>
</body>
</html>
